name: Release

# 推送 vx.y.z 格式的稳定版标签时触发（beta 等预发布标签不匹配）
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  WAILS_VERSION: v3.0.0-alpha.74

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 与 Linux 在 Ubuntu 上构建（Windows 为纯 Go 交叉编译，CGO_ENABLED=0）
          - name: windows-amd64
            os: ubuntu-latest
            task: release:build:windows:amd64
          - name: linux-amd64
            os: ubuntu-latest
            task: release:build:linux:amd64
          # macOS 需要真实 macOS 环境（CGO_ENABLED=1），arm64 主机可交叉构建 amd64
          - name: macos-arm64
            os: macos-latest
            task: release:build:macos:arm64
          - name: macos-amd64
            os: macos-latest
            task: release:build:macos:amd64
    steps:
      - uses: actions/checkout@v4

      - name: 同步标签版本号到 build/config.yml
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          export VERSION
          perl -pi -e "s/^(\s*version:\s*).*/\$1\"\$ENV{VERSION}\"/" build/config.yml
          grep -n 'version:' build/config.yml | head -1

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: 安装系统依赖（Ubuntu）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler zip pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: 安装系统依赖（macOS）
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: 安装构建工具链
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          npm install -g yarn

      - name: 更新构建资产（Info.plist / info.json / nfpm.yaml 等）
        run: task common:update:build-assets

      - name: 初始化发布目录
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: mkdir -p "bin/release/${TAG_NAME#v}"

      - name: 构建发布产物
        run: task ${{ matrix.task }}

      - name: 收集产物
        run: |
          mkdir -p dist
          find bin/release -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 同步标签版本号到 build/config.yml
        run: |
          VERSION="${TAG_NAME#v}"
          export VERSION
          perl -pi -e "s/^(\s*version:\s*).*/\$1\"\$ENV{VERSION}\"/" build/config.yml
        env:
          TAG_NAME: ${{ github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: release-dist
          merge-multiple: true

      - name: 生成发布说明与 update.json 更新清单
        run: |
          VERSION="${TAG_NAME#v}"
          export VERSION
          mkdir -p "bin/release/${VERSION}"
          cp release-dist/* "bin/release/${VERSION}/"
          ls -lh "bin/release/${VERSION}/"
          go run ./scripts/release notes -config ./build/config.yml -out "bin/release/${VERSION}/.release-notes.md" -source release-notes.md
          go run ./scripts/release manifest -config ./build/config.yml -assets-dir "bin/release/${VERSION}" -out "bin/release/${VERSION}/update.json" -repo "${{ github.repository }}" -base-name cursor-byok -notes "bin/release/${VERSION}/.release-notes.md"
          echo "RELEASE_DIR=bin/release/${VERSION}" >> "$GITHUB_ENV"

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_DIR }}/.release-notes.md
          files: |
            ${{ env.RELEASE_DIR }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}